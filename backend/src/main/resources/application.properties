spring.application.name=school-backend

# Database configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/school}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:school}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:school}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Allow H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.miasi.school=DEBUG

# JWT configuration. Override JWT_SECRET outside local development.
app.jwt.secret=${JWT_SECRET:local-development-jwt-secret-change-before-deploy}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Local demo settings. Keep enabled for the bundled demo accounts.
app.demo-mode=${APP_DEMO_MODE:true}
app.seed-demo-data=${APP_SEED_DEMO_DATA:true}
